name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: zhongan_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d zhongan_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZHONGAN_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/zhongan_ci
      ZHONGAN_AUTH_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/zhongan_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: python -m pip install -r services/api/requirements.txt httpx2==2.13.1
      - run: python -m unittest discover -s tests
      - run: python -m scripts.check_review_integration
      - run: python -m scripts.check_document_replacement
        env:
          ZHONGAN_REPLACEMENT_TEST_DATABASE_URL: ${{ env.ZHONGAN_DATABASE_URL }}
      - run: python -m scripts.check_conversation_integration
      - run: python -m scripts.check_conversation_titles
      - run: python -m scripts.check_knowledge_vectors_integration
      - run: python -m scripts.check_release_integration
      - run: for script in scripts/*.sh; do bash -n "$script"; done
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install pydantic==2.13.4
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npm run test:navigation --prefix apps/web
      - run: npm run test:auth --prefix apps/web
      - run: node apps/web/scripts/check-judge-entry.mjs
      - run: node apps/web/scripts/check-judge-upload.mjs
      - run: npm run test:availability --prefix apps/web
      - run: npm run test:reminders --prefix apps/web
      - run: npm run test:followups --prefix apps/web
      - run: npm run test:services --prefix apps/web
      - run: npm run test:medical-records --prefix apps/web
      - run: node apps/web/scripts/check-analysis-flow.mjs
      - run: node apps/web/scripts/check-chat-attachments.mjs
      - run: node apps/web/scripts/check-overview-content.mjs
      - run: node apps/web/scripts/check-claim-submission.mjs
      - run: node --experimental-strip-types apps/web/scripts/check-analysis-progress.mjs
      - run: node --experimental-strip-types scripts/check_fact_presentation.mjs
      - run: node --experimental-strip-types scripts/check_narrative_formatting.mjs
      - run: node --experimental-strip-types scripts/check_care_presentation.mjs
      - run: node scripts/check_records_page.cjs
      - run: node scripts/check_encounter_context.cjs
      - run: python scripts/build_proposal_preview.py --revision "$GITHUB_SHA" --base "/.mobile-demo-releases/$GITHUB_SHA/"
      - run: printf '%s\n' "$GITHUB_SHA" > apps/web/dist/CI_REVISION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-dist
          path: output_dir/mobile-demo/dist
          if-no-files-found: error
          retention-days: 14
