<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>评委体验 · 暖愈智护</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 10% 0%,#d6f5e7,transparent 55%),#f4faf7;color:#183e34;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;padding:24px}main{width:100%;max-width:440px;background:#fff;border:1px solid #e1eee7;border-radius:26px;padding:36px 28px;box-shadow:0 16px 56px #204f3410}.brand{font-size:13px;color:#008b67;letter-spacing:2px}.mark{font-size:40px;line-height:1;margin:28px 0 20px}h1{font-size:28px;margin:0 0 14px}p{font-size:15px;line-height:1.8;color:#647c70}.notice{font-size:12px;background:#f3f8f5;border-radius:12px;padding:14px;margin:24px 0 0}#status{min-height:54px}#retry{border:0;border-radius:12px;padding:13px 22px;background:#009c73;color:white;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #54caa6;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}.dots{display:inline-block;width:18px;height:18px;border:2px solid #cbe7db;border-top-color:#009c73;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:10px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.dots{animation:none}}
  </style>
  <script src="/judge/entry.js" defer></script>
</head>
<body><main>
  <span class="brand">众安 · 暖愈智护</span>
  <div class="mark" aria-hidden="true">🌱</div>
  <h1>欢迎体验</h1>
  <p>正在为您准备专属测试账号，<br>无需注册或输入密码。</p>
  <p id="status" role="status" aria-live="polite"><span class="dots" aria-hidden="true"></span>正在连接体验服务…</p>
  <button id="retry" type="button" hidden>重新连接</button>
  <p class="notice">每个浏览器使用独立体验账号，聊天和资料分别保存。同一浏览器再次扫码会回到原账号。请使用虚构资料体验。</p>
  <noscript><p>请在支持 JavaScript 的浏览器中打开体验链接。</p></noscript>
</main></body>
</html>
