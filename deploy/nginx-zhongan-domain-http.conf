server {
    listen 80;
    listen [::]:80;
    server_name zhongan.xinzhipingtai.cn;

    # HTTP-01 validation must remain available for unattended renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zhongan-web;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://zhongan.xinzhipingtai.cn$request_uri;
    }
}
