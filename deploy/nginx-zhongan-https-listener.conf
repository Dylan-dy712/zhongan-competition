# Installed inside the existing application server, sharing every API/UI route.
# The separate HTTP vhost redirects only the configured domain; IP access stays.
listen 443 ssl default_server;
listen [::]:443 ssl default_server;
ssl_certificate /etc/letsencrypt/live/zhongan.xinzhipingtai.cn/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/zhongan.xinzhipingtai.cn/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:ZHONGAN_TLS:10m;
ssl_session_timeout 1d;
