<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef9f5"><title>暖愈智护</title>
<link rel="stylesheet" href="proposal.css?v=14">
<link rel="stylesheet" href="care-home.css?v=12">
<link rel="stylesheet" href="onboarding.css?v=14">
<link rel="stylesheet" href="document-pages.css?v=14">
<link rel="stylesheet" href="expense-reference.css?v=14">
<link rel="stylesheet" href="claim-entry.css?v=9">
<link rel="stylesheet" href="report-chat.css?v=1"><link rel="stylesheet" href="inline-report.css?v=1"><link rel="stylesheet" href="records-page.css?v=1"><link rel="stylesheet" href="care-polish.css?v=1"></head>
<body><div class="app"><main class="main" id="main"></main><nav class="nav" id="nav" aria-label="主导航"></nav><div class="toast" id="toast" role="status"></div></div><dialog id="reminder" aria-labelledby="reminder-title"><div class="dialog-head"><h2 id="reminder-title">什么时候提醒你？</h2><button data-action="close-dialog" aria-label="关闭">×</button></div><p>复诊：10 月 12 日上午<br>具体时间和地点还需向医院核对。</p><form id="reminder-form"><label class="choice"><input type="radio" name="time" value="10 月 11 日 20:00" checked>提前一天，晚上 8 点</label><label class="choice"><input type="radio" name="time" value="10 月 12 日 08:00">当天，早上 8 点</label><button class="primary" type="submit">保存提醒</button><p class="notice">设置仅保存在当前页面，尚不能发送通知。</p></form></dialog>
<input type="file" id="upload-files" accept=".pdf,.png,.jpg,.jpeg" multiple hidden><input type="file" id="upload-camera" accept="image/*" capture="environment" hidden>
<dialog id="upload-sheet" aria-labelledby="upload-title" aria-describedby="upload-description"><div class="sheet-handle" aria-hidden="true"></div><div class="dialog-head"><div><span class="sheet-eyebrow">把新拿到的资料放在一起</span><h2 id="upload-title">补充看病资料</h2></div><button data-action="close-upload" aria-label="关闭上传选项"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p id="upload-description">出院记录、检查报告、用药单、费用清单都可以。</p><div class="upload-options"><button class="upload-option" data-action="camera"><span class="upload-option-icon"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M8 5 9.5 3h5L16 5h4a1 1 0 0 1 1 1v13H3V6a1 1 0 0 1 1-1Z"/><circle cx="12" cy="12" r="4"/></svg></span><span class="upload-option-copy"><strong>拍照添加</strong><small>拍清楚整页，文字不要被遮住</small></span><span class="upload-chevron" aria-hidden="true">›</span></button><button class="upload-option" data-action="choose-files"><span class="upload-option-icon file-choice"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V4h6l2 3h10v13H3Zm0 3h18M8 15h8"/></svg></span><span class="upload-option-copy"><strong>从手机选择</strong><small>选择已保存的照片或 PDF 文件</small></span><span class="upload-chevron" aria-hidden="true">›</span></button></div><div class="upload-tips"><span class="upload-tip-icon" aria-hidden="true">i</span><p>支持 JPG、PNG、PDF，每份不超过 10 MB<br>最多可添加 20 份资料</p></div><div class="upload-local-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>文件仅在本机预览，尚未上传</div></dialog>
<script src="proposal.js?v=14"></script><script src="document-pages.js?v=14"></script><script src="visit-summary.js?v=14"></script><script src="expense-page.js?v=14"></script><script src="proposal-flow.js?v=15"></script><script src="care-home.js?v=11"></script><script src="claim-entry.js?v=17"></script><script src="report-chat.js?v=1"></script><script src="inline-report.js?v=1"></script><script src="records-page.js?v=1"></script></body></html>
